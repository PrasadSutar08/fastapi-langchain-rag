[tool.poetry]
name = "enterprise-rag-api"
version = "1.0.0"
description = "Production-oriented FastAPI + PostgreSQL/PGVector + Ollama RAG API"
authors = ["Project"]
readme = "../README.md"

[tool.poetry.dependencies]
python = ">=3.11,<3.12"
fastapi = "0.110.0"
uvicorn = "0.29.0"
sqlalchemy = "2.0.29"
sqlmodel = "0.0.16"
asyncpg = "0.29.0"
psycopg2-binary = "2.9.9"
pgvector = "0.2.5"
pydantic = "2.13.4"
pydantic-settings = "2.15.0"
python-jose = "3.3.0"
passlib = "1.7.4"
bcrypt = "4.1.2"
python-multipart = "0.0.9"
loguru = "0.7.2"
redis = "5.0.3"
pyyaml = "6.0.1"
langchain-core = "1.6.0"
langchain-community = "0.4.2"
langchain-text-splitters = "1.1.2"
langchain-ollama = "1.1.0"
langchain-huggingface = "1.2.2"
sentence-transformers = "6.0.0"
torch = "2.5.1"
pypdf = "4.2.0"

[tool.poetry.group.dev.dependencies]
pytest = "8.0.0"
pytest-asyncio = "0.23.0"
httpx = "0.27.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
